##### hydra
hydra:
    run:
      dir: ./outputs/${exp_name}/${status}/${now:%Y-%m-%d}_${now:%H-%M-%S}
    sweep:
      dir: ./outputs/${exp_name}/${status}/${now:%Y-%m-%d}_${now:%H-%M-%S}
      subdir: ${hydra.job.override_dirname}

##### dir
exp_name: coded_flash/BDNeRV_RC
tester_name: coded_flash_tester
status: test
checkpoint: ${hydra:runtime.cwd}/checkpoints/model_best.pth
outputs_dir: outputs/

##### run
gpus: [0]
num_workers: 0
save_img: true

# params
frame_n: 16
trainer:
  epochs: 1

##### metrics
metrics:
  - _target_: srcs.metric.metric_iqa.IQA_Metric
    metric_name: psnr
  - _target_: srcs.metric.metric_iqa.IQA_Metric
    metric_name: ssim
  - _target_: srcs.metric.metric_iqa.IQA_Metric
    metric_name: lpips

##### data&nets
defaults:
  - data: coded_flash_pair_test_data
  - network: coded_flash
  - override hydra/job_logging : custom
  - override hydra/hydra_logging: colorlog
  - _self_
